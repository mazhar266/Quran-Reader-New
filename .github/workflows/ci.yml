name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # resources/ (raw KFGQPC/QUL material, ~460 MB) is only needed by the pipeline.
          sparse-checkout: |
            lib
            test
            assets
            android
            ios
            tools
      - name: System SQLite for host tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors and warnings fail the build; infos do not. Flutter 3.50 deprecates
      # package:flutter/material.dart in favour of package:material_ui, reported as infos.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
